name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: tidy + vet + build
        run: |
          go mod tidy
          go vet ./...
          gofmt -l . | tee fmt.log; test ! -s fmt.log || echo "::warning::gofmt 存在未格式化文件"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o singbox-gen .
      - name: smoke render (空数据目录引导 + 两端渲染 + 内置校验)
        run: |
          # 只给一个空目录：验证首次运行自动引导（示例配置 + 占位自签证书）
          mkdir -p /tmp/d
          ./singbox-gen -data /tmp/d -addr 127.0.0.1:18090 &
          sleep 1
          test -f /tmp/d/homelab.yaml || { echo "引导失败: 未生成 homelab.yaml"; exit 1; }
          ls -l /tmp/d /tmp/d/certs
          # /p 走完整渲染管线（dns/route 装配 + 解析 + 引用闭环），失败即非 200
          curl -fsS http://127.0.0.1:18090/p/demo-profile/sfa.json -o /tmp/sfa.json
          curl -fsS http://127.0.0.1:18090/p/demo-profile/sfi.json -o /tmp/sfi.json
          head -c 120 /tmp/sfa.json; echo
          # 网关端同样走渲染 + 校验（含 pinned 块）
          curl -fsS "http://127.0.0.1:18090/download/SFL" -o /tmp/gw.zip
          curl -fsS "http://127.0.0.1:18090/download/SFA" -o /tmp/sfa.zip
          curl -fsS "http://127.0.0.1:18090/download/SFI" -o /tmp/sfi.zip
          for z in gw sfa sfi; do test -s /tmp/$z.zip || { echo "$z 下载为空"; exit 1; }; done
          test -s /tmp/gw.zip && echo "SFL 渲染 OK ($(stat -c%s /tmp/gw.zip) bytes)"
          curl -fsS http://127.0.0.1:18090/api/status; echo
          curl -fsS "http://127.0.0.1:18090/api/preview?target=SFL&mode=ebpf" | head -c 200; echo
          curl -fsS http://127.0.0.1:18090/api/modes; echo
          # 规则保存链路：GET → PUT 原样回写 → 再 GET 必须一致（覆盖 yaml.Node 定点替换）
          curl -fsS http://127.0.0.1:18090/api/rules -o /tmp/rules1.json
          curl -fsS -X PUT http://127.0.0.1:18090/api/rules \
            -H "Content-Type: application/json" --data-binary @/tmp/rules1.json -o /tmp/put.out
          cat /tmp/put.out
          curl -fsS http://127.0.0.1:18090/api/rules -o /tmp/rules2.json
          cmp /tmp/rules1.json /tmp/rules2.json && echo "rules PUT round-trip OK"
          curl -fsS http://127.0.0.1:18090/ >/dev/null && echo "bootstrap + render OK"
      - uses: actions/upload-artifact@v4
        with:
          name: singbox-gen-linux
          path: singbox-gen

  image:
    needs: compile-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
