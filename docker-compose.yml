# 镜像由 GitHub Actions 构建并发布（ghcr.io/<owner>/<repo>），NAS 只 pull 不 build
services:
  singbox-gen:
    image: ghcr.io/CHANGE_ME/singbox-gen:latest   # 改成你的 GHCR 路径（必须全小写）
    container_name: singbox-gen
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data                              # homelab.yaml / certs / keys 只在部署机本地
    environment:
      - TZ=Asia/Shanghai
# 本地构建（可选）：docker build -t singbox-gen:local . && 把 image 改成 singbox-gen:local
